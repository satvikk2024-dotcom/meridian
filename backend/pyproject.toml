[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian"
version = "0.1.0"
description = "Multi-agent due diligence system"
requires-python = ">=3.11"

dependencies = [
    # Web framework + ASGI server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",       # [standard] adds websockets + watchfiles for --reload

    # Database + ORM
    "sqlmodel>=0.0.22",              # wraps SQLAlchemy with Pydantic models — one schema, two uses
    "aiosqlite>=0.20",               # async SQLite driver required by SQLModel async sessions

    # Validation + settings
    "pydantic>=2.0",
    "pydantic-settings>=2.0",        # loads .env into typed Settings class

    # HTTP client (async) — for Ollama, SEC, Reddit, etc.
    "httpx>=0.27",

    # Async file I/O — for the disk cache layer
    "aiofiles>=24.0",

    # Structured logging
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]            # pycodestyle errors, pyflakes, isort

[tool.pytest.ini_options]
asyncio_mode = "auto"               # all async test functions run without @pytest.mark.asyncio
testpaths = ["tests"]
